[project]
name = "aidial-client"
version = "0.0.0"
description = "A Python client library for the AI DIAL API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
authors = [{ name = "DIALX", email = "SpecialEPM-DIALDevTeam@epam.com" }]
dependencies = [
    "openai>=1.1.0,<3",
    "httpx>=0.25.0,<1",
    "pydantic>=1.10,<3",
    "aiofiles>=0.5.0",
]

[project.urls]
Homepage = "https://dialx.ai"
Repository = "https://github.com/epam/ai-dial-client-python"

[tool.poetry]
packages = [{ include = "aidial_client" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^0.21.0"
nox = "^2024.4.15"
pytest-cov = "^5.0"
coverage = "^7.6"

[tool.poetry.group.lint.dependencies]
pyright = "1.1.385"
ruff = "0.12.11"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.5.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "basic"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
exclude = ["**/node_modules", "**/__pycache__", "**/.*", ".venv"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = [
    "ERA",  # flake8-eradicate
    "B",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "B9",   # flake8-bugbear
    "E",    # pycodestyle
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # flake8-isort
    "S",    # flake8-bandit
    "FURB", # refurb
    "UP",   # pyupgrade
]

ignore = [
    "S101",  # Use of `assert` detected
    "B904",  # Within an `except` clause, raise exceptions with `raise ... from err` or `raise ... from None`
    "UP007", # Use `X | Y` for type annotations — breaks Pydantic v1 runtime parsing
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "E501", # String literal is too long
    "B011", # Do not `assert False`
    "B006", # Do not use mutable data structures for argument defaults
]
"*/__init__.py" = [
    "F401", # imported but unused
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "*/__init__.py",
    "noxfile.py",
    'aidial_client/_compatibility/pydantic_v1.py',
    'htmlcov/*',
]
